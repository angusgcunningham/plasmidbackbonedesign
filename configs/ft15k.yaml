run:
  name: "ft15k"
  dir: "runs/ft15k"

paths:
  dataset_input: "data/train_fasta"
  tokenizer_json: "models/tokenizer.json"
  base_model: "models/base_model.pt"
  model_output_dir: "runs/ft15k/models/ft15k"
  generation_output_dir: "runs/ft15k/generations"
  qc_output_dir: "runs/ft15k/qc"
  analysis_output_dir: "runs/ft15k/analysis"

training:
  ctx: 2048
  stride: null
  epochs: 3
  batch_size: 1
  grad_accum: 8
  learning_rate: 5e-5

generation:
  seed: "ATG"
  num_samples: 1000
  target_mean_bp: 4000
  target_spread_bp: 1500
  temperature: 1.05
  top_p: 0.95
  repetition_penalty: 1.05
  max_new_tokens: 12000

qc:
  oridb_prefix: "data/oriVdb/oriV_db"
  oridb_ref: "data/oriVdb/oriV_refs.fasta"
  min_pident: 85.0
  min_scovs: 80.0
  min_len: 100
  threads: 4
  skip_prodigal: false
  filter:
    ori_low_identity: 85.0
    ori_low_cov: 80.0
    ori_low_count_min: 1
    ori_low_count_max: 1
    amr_low_identity: 85.0
    amr_low_cov: 80.0
    amr_low_count_min: 1
    amr_low_count_max: 2
    ori_strict_identity: 99.0
    ori_strict_cov: 99.0
    amr_strict_identity: 100.0
    amr_strict_cov: 100.0
    amr_strict_min: 1
    amr_strict_all: false

analysis:
  similarity:
    db_path: "data/plasmid_db"
    max_target_seqs: 5
  metadata:
    enabled: true
  kmer:
    k: 4
  plannotate:
    enabled: false
    yaml_file: null
